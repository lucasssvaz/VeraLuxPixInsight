name: Build VeraLuxPixInsight Module

# Toolchain requirements follow the PCL README:
# https://gitlab.com/pixinsight/PCL/-/blob/master/README.md
#   Linux:   Ubuntu 22.04, GCC 12+, C++20
#   macOS:   macOS 15+/26, Clang 17+ / Xcode 26+, C++20 (ARM64 + x86_64)
#   Windows: Visual C++ 2022, C++20

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - '.github/scripts/generate_build_files.py'
      - '.github/scripts/generate_pcl_vcxproj.py'
      - '.github/scripts/set_build_env.sh'
      - '.github/workflows/build.yml'
      - 'build.sh'
  pull_request:
    paths:
      - 'src/**'
      - '.github/scripts/generate_build_files.py'
      - '.github/scripts/generate_pcl_vcxproj.py'
      - '.github/scripts/set_build_env.sh'
      - '.github/workflows/build.yml'
      - 'build.sh'
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build for Linux (Ubuntu 22.04 / GCC 12)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC 12 (PCL requirement)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 120
          gcc --version
          g++ --version
          g++ -dumpversion | grep -E '^(12|1[3-9]|[2-9][0-9])'

      - name: Clone PCL repository
        run: |
          cd ..
          if [ ! -d "PCL" ]; then
            git clone https://gitlab.com/pixinsight/PCL.git
          fi

      - name: Get PCL commit hash
        id: pcl-version
        run: |
          cd ../PCL
          PCL_HASH=$(git rev-parse HEAD)
          echo "hash=$PCL_HASH" >> $GITHUB_OUTPUT
          echo "PCL commit: $PCL_HASH"

      - name: Resolve PCL paths
        id: pcl-paths
        run: |
          PCL_ROOT=$(realpath "${{ github.workspace }}/..")/PCL
          echo "lib_path=$PCL_ROOT/lib/linux/x64" >> $GITHUB_OUTPUT
          echo "bin_path=$PCL_ROOT/bin" >> $GITHUB_OUTPUT

      - name: Cache PCL build
        id: cache-pcl
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pcl-paths.outputs.lib_path }}
            ${{ steps.pcl-paths.outputs.bin_path }}
          key: pcl-linux-x64-gcc12-${{ steps.pcl-version.outputs.hash }}
      
      - name: Build module
        run: bash build.sh --platform=linux
        env:
          PCL_CACHE_HIT: ${{ steps.cache-pcl.outputs.cache-hit }}
      
      - name: Verify Linux binary
        run: |
          BINARY=bin/linux/VeraLuxPixInsight-pxm.so
          test -f "$BINARY"
          file "$BINARY"
          file "$BINARY" | grep -Eq 'x86-64|ELF 64-bit'
          ls -lh "$BINARY"
      
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/linux/VeraLuxPixInsight-pxm.so
          retention-days: 30

  build-macos:
    name: Build for macOS (macOS 26 / Xcode 26 / x64+arm64)
    runs-on: macos-26
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 (PCL requirement)
        run: |
          # Prefer versions cited in the PCL README, then any Xcode 26.x
          selected=""
          for candidate in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.app; do
            if [ -d "$candidate" ]; then
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            selected=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$selected" ]; then
            echo "No Xcode 26.x installation found under /Applications"
            ls /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$selected"
          echo "Selected $selected"
          xcodebuild -version
          clang++ --version

      - name: Verify Clang / Xcode toolchain
        run: |
          XCODE_MAJOR=$(xcodebuild -version | head -1 | sed 's/Xcode //' | cut -d. -f1)
          test "$XCODE_MAJOR" -ge 26
          echo "Host arch: $(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Clone PCL repository
        run: |
          cd ..
          if [ ! -d "PCL" ]; then
            git clone https://gitlab.com/pixinsight/PCL.git
          fi

      - name: Get PCL commit hash
        id: pcl-version
        run: |
          cd ../PCL
          PCL_HASH=$(git rev-parse HEAD)
          echo "hash=$PCL_HASH" >> $GITHUB_OUTPUT
          echo "PCL commit: $PCL_HASH"

      - name: Resolve PCL paths
        id: pcl-paths
        run: |
          PCL_ROOT=$(realpath "${{ github.workspace }}/..")/PCL
          echo "lib_arm64=$PCL_ROOT/lib/macosx/arm64" >> $GITHUB_OUTPUT
          echo "lib_x64=$PCL_ROOT/lib/macosx/x64" >> $GITHUB_OUTPUT
          echo "bin_path=$PCL_ROOT/bin" >> $GITHUB_OUTPUT

      - name: Cache PCL build
        id: cache-pcl
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pcl-paths.outputs.lib_arm64 }}
            ${{ steps.pcl-paths.outputs.lib_x64 }}
            ${{ steps.pcl-paths.outputs.bin_path }}
          key: pcl-macos-x64-arm64-xcode26-${{ steps.pcl-version.outputs.hash }}

      - name: Build module (x64 + arm64)
        run: bash build.sh --platform=macosx
        env:
          PCL_CACHE_HIT: ${{ steps.cache-pcl.outputs.cache-hit }}
          MACOSX_ARCH: all
      
      - name: Verify macOS binaries
        run: |
          test -f bin/macosx/x64/VeraLuxPixInsight-pxm.dylib
          test -f bin/macosx/arm64/VeraLuxPixInsight-pxm.dylib
          file bin/macosx/x64/VeraLuxPixInsight-pxm.dylib
          file bin/macosx/arm64/VeraLuxPixInsight-pxm.dylib
          file bin/macosx/x64/VeraLuxPixInsight-pxm.dylib | grep -q x86_64
          file bin/macosx/arm64/VeraLuxPixInsight-pxm.dylib | grep -q arm64
          ls -lh bin/macosx/x64/ bin/macosx/arm64/
      
      - name: Upload macOS x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-binary
          path: bin/macosx/x64/VeraLuxPixInsight-pxm.dylib
          retention-days: 30

      - name: Upload macOS arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-binary
          path: bin/macosx/arm64/VeraLuxPixInsight-pxm.dylib
          retention-days: 30

  build-windows:
    name: Build for Windows (VS 2022)
    runs-on: windows-2022
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone PCL repository
        shell: bash
        run: |
          cd ..
          if [ ! -d "PCL" ]; then
            git clone https://gitlab.com/pixinsight/PCL.git
          fi

      - name: Get PCL commit hash
        id: pcl-version
        shell: bash
        run: |
          cd ../PCL
          PCL_HASH=$(git rev-parse HEAD)
          echo "hash=$PCL_HASH" >> $GITHUB_OUTPUT
          echo "PCL commit: $PCL_HASH"

      - name: Resolve PCL paths
        id: pcl-paths
        shell: bash
        run: |
          PCL_ROOT=$(realpath "${{ github.workspace }}/..")/PCL
          echo "lib_path=$PCL_ROOT/lib/windows/x64" >> $GITHUB_OUTPUT
          echo "bin_path=$PCL_ROOT/bin" >> $GITHUB_OUTPUT

      - name: Cache PCL build
        id: cache-pcl
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pcl-paths.outputs.lib_path }}
            ${{ steps.pcl-paths.outputs.bin_path }}
          key: pcl-windows-x64-vs2022-${{ steps.pcl-version.outputs.hash }}
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
          vs-version: '[17.0,18.0)'

      - name: Find and verify MSBuild 17.x
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found"
            exit 1
          }

          $msbuildPath = & $vswhere -version "[17.0,18.0)" -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuildPath) {
            Write-Error "MSBuild 17.x (Visual Studio 2022) not found"
            exit 1
          }

          $msbuildDir = Split-Path -Parent $msbuildPath
          Add-Content -Path $env:GITHUB_PATH -Value $msbuildDir
          Write-Host "MSBuild found at: $msbuildPath"

          $versionOutput = & $msbuildPath -version 2>&1 | Select-Object -First 1
          if ($versionOutput -match "(\d+)\.(\d+)\.(\d+)") {
            $majorVersion = [int]$matches[1]
            $fullVersion = $matches[0]
            if ($majorVersion -ne 17) {
              Write-Error "MSBuild version $fullVersion found, but version 17.x is required by PCL"
              exit 1
            }
            Write-Host "MSBuild version verified: $fullVersion (17.x)"
          } else {
            Write-Error "Could not parse MSBuild version from: $versionOutput"
            exit 1
          }
      
      - name: Build module
        shell: bash
        run: bash build.sh --platform=windows
        env:
          PCL_CACHE_HIT: ${{ steps.cache-pcl.outputs.cache-hit }}
      
      - name: Verify Windows binary
        shell: bash
        run: |
          BINARY=bin/windows/VeraLuxPixInsight-pxm.dll
          test -f "$BINARY"
          file "$BINARY" || true
          ls -lh "$BINARY"
      
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: bin/windows/VeraLuxPixInsight-pxm.dll
          retention-days: 30

  collect-binaries:
    name: Collect and Commit Binaries
    runs-on: ubuntu-22.04
    needs: [build-linux, build-macos, build-windows]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: bin/linux
      
      - name: Download macOS x64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-binary
          path: bin/macosx/x64

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-binary
          path: bin/macosx/arm64
      
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: bin/windows

      - name: Verify collected binaries
        run: |
          file bin/linux/VeraLuxPixInsight-pxm.so
          file bin/macosx/x64/VeraLuxPixInsight-pxm.dylib
          file bin/macosx/arm64/VeraLuxPixInsight-pxm.dylib
          file bin/windows/VeraLuxPixInsight-pxm.dll
          file bin/linux/VeraLuxPixInsight-pxm.so | grep -Eq 'x86-64|ELF 64-bit'
          file bin/macosx/x64/VeraLuxPixInsight-pxm.dylib | grep -q x86_64
          file bin/macosx/arm64/VeraLuxPixInsight-pxm.dylib | grep -q arm64
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit binaries
        run: |
          # Drop legacy flat macOS binary if present
          git rm -f --ignore-unmatch bin/macosx/VeraLuxPixInsight-pxm.dylib \
            bin/macosx/VeraLuxPixInsight-pxm.xsgn || true
          git add bin/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update compiled binaries [skip ci]"
            git push
          fi
