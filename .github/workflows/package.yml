name: Package VeraLuxPixInsight Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Module version (e.g., 0.1.0)'
        required: true
        type: string
      pixinsight_min_version:
        description: 'Minimum PixInsight version'
        required: false
        default: '1.8.9'
        type: string
      pixinsight_max_version:
        description: 'Maximum PixInsight version'
        required: false
        default: '1.9.99'
        type: string

jobs:
  package:
    name: Create Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify signed binaries exist
        run: |
          echo "Checking for signed binaries..."
          
          if [ ! -f "bin/linux/VeraLuxPixInsight-pxm.so" ] || \
             [ ! -f "bin/linux/VeraLuxPixInsight-pxm.xsgn" ]; then
            echo "Error: Linux binary/signature missing under bin/linux/"
            exit 1
          fi
          
          if [ ! -f "bin/macosx/x64/VeraLuxPixInsight-pxm.dylib" ] || \
             [ ! -f "bin/macosx/x64/VeraLuxPixInsight-pxm.xsgn" ]; then
            echo "Error: macOS x64 binary/signature missing under bin/macosx/x64/"
            exit 1
          fi

          if [ ! -f "bin/macosx/arm64/VeraLuxPixInsight-pxm.dylib" ] || \
             [ ! -f "bin/macosx/arm64/VeraLuxPixInsight-pxm.xsgn" ]; then
            echo "Error: macOS arm64 binary/signature missing under bin/macosx/arm64/"
            exit 1
          fi
          
          if [ ! -f "bin/windows/VeraLuxPixInsight-pxm.dll" ] || \
             [ ! -f "bin/windows/VeraLuxPixInsight-pxm.xsgn" ]; then
            echo "Error: Windows binary/signature missing under bin/windows/"
            exit 1
          fi
          
          echo "✓ All signed binaries found"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Create release packages
        run: |
          python .github/scripts/package_release.py \
            --version="${{ inputs.version }}" \
            --min-pi-version="${{ inputs.pixinsight_min_version }}" \
            --max-pi-version="${{ inputs.pixinsight_max_version }}"
      
      - name: Verify package output
        run: |
          echo "Checking dist/ directory..."
          ls -lh dist/
          
          if [ ! -f "dist/updates.xri" ]; then
            echo "Error: updates.xri not found"
            exit 1
          fi

          grep -q 'arch="x64"' dist/updates.xri
          grep -q 'arch="arm64"' dist/updates.xri
          grep -q 'os="macosx"' dist/updates.xri
          
          # Expect four packages: linux/x64, macosx/x64, macosx/arm64, windows/x64
          zip_count=$(ls dist/*.zip 2>/dev/null | wc -l | tr -d ' ')
          if [ "$zip_count" -lt 4 ]; then
            echo "Error: expected at least 4 package files, found $zip_count"
            ls dist/*.zip || true
            exit 1
          fi
          
          echo "✓ All packages created successfully"
      
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 90
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit distribution packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: package release v${{ inputs.version }}"
            git push
          fi
